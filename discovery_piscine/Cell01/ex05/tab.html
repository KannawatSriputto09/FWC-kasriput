<!DOCTYPE html>
<head>
    <title>Tab</title>
    <style>
        td {
            height: 100px;
        }
    </style>
</head>
<body>
    <table style="width: 100%; border-collapse: collapse;">
        <tr>
            <td style="background-color: #b5c26e;">First cell</td>
            <td style="background-color: #f4b79a;">Second cell</td>
        </tr>
    </table>

</body>
</html>
