<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        height: 100%;
    }
    body {
      margin: 0;
      height: 100%;
    }
 
    table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
    }
 
    td {
      width: 50%;
      vertical-align: top;
    }
 
    .first-cell {
      background-color: #b5c26e;
    }
 
    .second-cell {
      background-color: #f4b79a;
    }
  </style>
</head>
<body>
 
  <table>
    <tr>
      <td class="first-cell">First cell</td>
      <td class="second-cell">Second cell</td>
    </tr>
  </table>
 
</body>
</html>
