<!DOCTYPE html>
<head>
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="calculator">
        <h1>Calculator</h1>

        <div class="row">
            <input type="text" id="left" class="calc-input" placeholder="0">

            <select id="operator" class="calc-select">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>

            <input type="text" id="right" class="calc-input" placeholder="0">
        </div>

        <input type="submit" id="try-me" value="Try me!" class="calc-submit">
    </div>

    <script src="calc.js"></script>
</body>
</html>
